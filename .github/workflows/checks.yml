# .github/workflows/checks.yml
#
# CI RUNS `tools/verify.sh` AND NOTHING ELSE, and that is the whole design.
#
# It used to run a hand-copied subset of that script's steps, under a header in
# `verify.sh` reading "run exactly what CI runs, in the same order". The two
# drifted: the gate grew a transport selftest, a tracked-tile guard and a
# compile check, and none of the three ever ran on a push. A sentence saying
# two things are the same is not a mechanism for keeping them the same. So
# there is one definition of the gate and this file supplies it an engine.
#
# Godot is downloaded from the engine's own releases rather than through a
# third-party setup action. The no-addons rule in README.md is about the
# PROJECT, not about CI -- but a marketplace action is the same class of
# dependency, and a pinned URL to an official release is both smaller and
# easier to audit than one.
name: checks

on: [push, pull_request]

env:
  # Current stable. Bump here and in project.godot together -- a local/CI
  # version split is a class of failure neither side can see.
  GODOT_VERSION: "4.7.2"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # PINNED TO A MAJOR AND BUMPED DELIBERATELY, not left to drift. `v4` and
      # `v5` target Node.js 20, which GitHub deprecated: the runner forced them
      # onto Node 24 anyway and annotated every green run saying so. A warning
      # that appears on every run and changes nothing is a warning people learn
      # to scroll past, and the next one will be under it.
      #
      # Node 24 arrived in `checkout@v5` and `setup-python@v6`, so this is a
      # bump to CURRENT rather than the minimum that clears the annotation.
      # What the majors in between change, checked rather than assumed, because
      # the only input this job passes is `python-version`:
      #
      #   * checkout v6 persists credentials to a separate file; v7 blocks
      #     checking out a fork's PR under `pull_request_target` and
      #     `workflow_run`. This workflow triggers on `push` and
      #     `pull_request`, so that one is a hardening and not a loss.
      #   * setup-python v7 removes the `pip-install` input, which is not used
      #     here, and stops classifying stderr warnings as error annotations.
      #
      # Both need runner >= v2.327.1; `ubuntu-latest` is long past it.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: the gate
        # `verify.sh` fetches the artefacts decision 948 keeps out of the tree
        # -- the 28 MB fixture binary is `--require`d and the 141 MB tile
        # pyramid is not, because the checks that need the pyramid skip and
        # say so while the fixture is what this client exists to display. A
        # run without it failed 38 checks and named `band.bare_fraction gave 0
        # values` thirty-eight times rather than the one missing file.
        #
        # The script sets its own exit code AND greps its own logs. Both,
        # measured: on this repo's first CI run Godot exited 0 with four
        # scripts failing to load on a parse error, and until today the gate
        # itself printed FAILED and returned success.
        run: GODOT=./godot bash tools/verify.sh
